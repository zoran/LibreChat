name: Lighthouse CI

on:
  workflow_call:
    inputs:
      upload_frontend_build:
        description: Upload the verified frontend build for image publishing in this run.
        type: boolean
        default: false
  pull_request:
    paths:
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'packages/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/frontend-build*.mjs'
      - '.github/workflows/lighthouse.yml'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_CHROMIUM_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Verify frontend build artifact integrity
        run: node --test scripts/ci/frontend-build.test.mjs
      - run: npm ci
      - run: npm run e2e:prepare
      - name: Verify managed documents reach model-neutral chat context
        run: npm run test:managed-documents
      - run: google-chrome --version
      - name: Preserve configured presentation and upstream defaults
        run: npm run test:presentation
      - name: Verify fixed language and branding in rendered browsers
        run: npm run e2e:presentation
      - name: Audit serial database latency
        id: audit
        shell: bash
        run: |
          set -o pipefail
          npm run lighthouse:run 2>&1 | tee lighthouse-ci.log
      - name: Comment Lighthouse findings
        if: ${{ failure() && steps.audit.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Lighthouse CI failed. The last 80 log lines contain the measured budgets and assertion failures.'
            echo
            echo '```text'
            tail -n 80 lighthouse-ci.log
            echo '```'
            echo
            echo "[Open the full run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > lighthouse-comment.md
          gh pr comment "$PR_NUMBER" --body-file lighthouse-comment.md
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse
          path: |
            .lighthouse/
            lighthouse-ci.log
            e2e/presentation/.test-results/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
      - name: Package verified frontend build
        if: ${{ inputs.upload_frontend_build }}
        run: node scripts/ci/frontend-build.mjs pack --revision "$GITHUB_SHA" --directory ci-build
      - name: Upload verified frontend build
        if: ${{ inputs.upload_frontend_build }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build-${{ github.sha }}
          path: ci-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true
